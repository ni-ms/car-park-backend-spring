
spring.application.name=car-parking-system
server.port=8080


spring.main.allow-circular-references=true

# ===========================================
# Database Configuration - H2 (Development)
# ===========================================
spring.datasource.url=jdbc:h2:mem:carparkdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


#spring.datasource.url=jdbc:postgresql://localhost:5432/carparkdb
#spring.datasource.username=postgres
#spring.datasource.password=postgres
#spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For PostgreSQL, use: org.hibernate.dialect.PostgreSQLDialect

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Enable JPA Auditing
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=false

# ===========================================
# Flyway Configuration (Optional - Disable if using ddl-auto=update)
# ===========================================
spring.flyway.enabled=false
#spring.flyway.baseline-on-migrate=true
#spring.flyway.locations=classpath:db/migration
#spring.flyway.schemas=public

# ===========================================
# JWT Configuration
# ===========================================
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000


spring.cache.type=simple
spring.cache.cache-names=users,booking,availableSlots,parking,slot,worker,userDetails,feedbacks,payment

# Redis Configuration (Optional - Uncomment if using Redis)
#spring.data.redis.host=localhost
#spring.data.redis.port=6379
#spring.cache.type=redis
#spring.cache.redis.time-to-live=300000
#spring.cache.redis.cache-null-values=false




management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true


# Allow H2 console through security
spring.h2.console.settings.web-allow-others=true


app.admin.default.enabled=true
app.admin.default.username=admin
app.admin.default.password=admin123
app.admin.default.email=admin@carparkingsystem.com
app.admin.default.firstName=System
app.admin.default.lastName=Administrator


logging.level.root=INFO
logging.level.com.carparkspring.demo=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Logging pattern
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log file (optional)
#logging.file.name=logs/carpark.log
#logging.file.max-size=10MB
#logging.file.max-history=30


spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000


server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=false


spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Asia/Kolkata
spring.jackson.default-property-inclusion=non_null

spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
